name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          # 目标用户大多在 Windows 上。核心路径没有任何平台分支（只有 `--pdf`
          # 那条明确只支持 macOS + Word），但「大概率没事」和「测过」是两回事。
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q -m "not word and not localdata"

  lint:
    name: ruff（未使用导入/变量与未定义名字）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  end-to-end:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q -rs -m "not word and not localdata"
      - name: 技能入口导出内置示例
        run: bash scripts/export.sh demo/01_chinese_thesis/thesis_sample.md -o "$RUNNER_TEMP/thesis.docx"
      - name: 产物存在且非空
        run: test -s "$RUNNER_TEMP/thesis.docx"

  package:
    name: wheel 内的预设与资源
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: 预设与底模必须打进 wheel
        run: |
          python - <<'EOF'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for needed in (
              "md_to_word/presets/zh-academic.txt",
              "md_to_word/presets/en-nature.txt",
              "md_to_word/resources/pure_modern_base.docx",
              "md_to_word/resources/csl/nature.csl",
              "md_to_word/csl/data/locales/locales.json",
              "md_to_word/csl/data/locales/locales-en-US.xml",
              "md_to_word/csl/LICENSE",
          ):
              assert any(n.endswith(needed) for n in names), f"wheel 内缺少 {needed}"
          print(f"包内资源齐全（{len(names)} 个文件）")
          EOF
      - name: wheel 装进干净环境后能跑通
        # 只查文件名不等于装得上：源码检出跑测试会掩盖入口点、包内资源路径与依赖声明的问题。
        # 这里用构建产物本身 init → 导出 → 读契约，走一遍用户第一次接触的三步。
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q dist/*.whl
          "$RUNNER_TEMP/venv/bin/md-to-word" init "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/venv/bin/md-to-word" "$RUNNER_TEMP/smoke/hello.md" -o "$RUNNER_TEMP/smoke/hello.docx"
          test -s "$RUNNER_TEMP/smoke/hello.docx"
          "$RUNNER_TEMP/venv/bin/md-to-word" --contract --json > /dev/null
