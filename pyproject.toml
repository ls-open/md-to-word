[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-to-word-docx"
dynamic = ["version"]
description = "Deterministic Markdown to Word (.docx) compiler: declared typography, native equations, tables, cross-references, CSL bibliographies, pre- and post-export quality gates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Liu Song" }
]
keywords = ["markdown", "word", "docx", "docx-generator", "typography", "ooxml", "csl", "latex", "thesis", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "python-docx>=1.1.0",
    "lxml>=4.9.0",
    "PyYAML>=6.0",
    # LaTeX → MathML：MathML 是 W3C 标准，解析器借成熟的；MathML → OMML 没有标准，
    # 那一段在我们自己的 transform/mathml2omml.py 里
    "latex2mathml>=3.0",
    # CSL 引文引擎：`src/md_to_word/csl/`，派生自 citeproc-py 0.12.2（BSD-2-Clause），
    # 引擎内部方法已按本项目需要直接改写，因此不再作为外部依赖。
    # PDF 图 → 位图（Word 的内联图片只认位图），以及底模页面验真时读 PDF 页文本/坐标。
    # 学术稿的图大多默认导出 PDF，这一步不装就有一半稿件导不出去；页面读取也不再有
    # poppler 这个外部依赖。4.30 起 API 与 5.x 一致，老 macOS 也还有轮子
    "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://github.com/ls-open/md-to-word"
Documentation = "https://github.com/ls-open/md-to-word/blob/main/src/md_to_word/resources/manual_en.md"
Repository = "https://github.com/ls-open/md-to-word"
Issues = "https://github.com/ls-open/md-to-word/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
test = [
    "pytest>=7.0",
    "mcp>=1.0.0",
]
all = [
    "mcp>=1.0.0",
    "pytest>=7.0",
]

[project.scripts]
md-to-word = "md_to_word.cli:main"
md-to-word-template = "md_to_word.template.extractor:main"
md-to-word-mcp = "md_to_word.mcp.server:main"

[tool.setuptools.dynamic]
version = { attr = "md_to_word.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md_to_word = [
    "presets/*.txt",
    "resources/**/*",
    "csl/LICENSE",
    "csl/data/locales/*.xml",
    "csl/data/locales/locales.json",
]

[tool.pytest.ini_options]
markers = [
    "word: 需要本机 Microsoft Word 才能做的排版验真",
    "localdata: 需要 gitignore 的 testdata/base_templates 才能跑",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# 只开门禁能稳定守住的一组：未使用导入/变量、未定义名字、语法级错误。
# 行宽与风格类规则不在这里判——仓库刻意保留了大量信息密度高的长句和中文注释。
select = ["E4", "E7", "E9", "F"]
