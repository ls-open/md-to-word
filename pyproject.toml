[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-to-word-docx"
dynamic = ["version"]
description = "Deterministic Markdown to Word (.docx) compiler: declared typography, native equations, tables, cross-references, CSL bibliographies, pre- and post-export quality gates."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Liu Song" }
]
keywords = ["markdown", "word", "docx", "docx-generator", "typography", "ooxml", "csl", "latex", "thesis", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-docx>=1.1.0",
    "lxml>=4.9.0",
    "PyYAML>=6.0",
    # LaTeX → MathML：MathML 是 W3C 标准，解析器借成熟的；MathML → OMML 没有标准，
    # 那一段在我们自己的 transform/mathml2omml.py 里
    "latex2mathml>=3.0",
    # CSL 引文渲染：2 MB，只依赖 lxml
    "citeproc-py>=0.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
md-to-word = "md_to_word.cli:main"
md-to-word-template = "md_to_word.template.extractor:main"

[tool.setuptools.dynamic]
version = { attr = "md_to_word.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md_to_word = ["presets/*.txt", "resources/**/*"]
